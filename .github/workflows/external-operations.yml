name: External operations

on:
  repository_dispatch:
    types: [microcms_publish, bassic_calendar_sync]
  workflow_dispatch:
    inputs:
      cms_readonly_diagnostics:
        type: boolean
        default: false
        description: Read CMS schema and record counts only; never write to CMS or Google
      check_only:
        type: boolean
        default: false
        description: Verify the calendar input without writing to external services
  schedule:
    - cron: "42 * * * *"

permissions:
  contents: read

concurrency:
  group: external-operations
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.bassic.jp' }}

jobs:
  cms-readonly-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.cms_readonly_diagnostics == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/diagnose-cms-readonly.mjs
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
  check-calendar:
    if: inputs.check_only == true && inputs.cms_readonly_diagnostics != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate current CMS events without updating the calendar
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_SYNC_CMS_ONLY: 'true'
        run: |
          if npm run sync:calendar:check > "$RUNNER_TEMP/bassic-calendar-check.log" 2>&1; then
            grep -E '確認のみ: [0-9]+ 件|同期対象イベントがありません' "$RUNNER_TEMP/bassic-calendar-check.log" | sed -E 's/(確認のみ: [0-9]+ 件).*/\1/; s/(同期対象イベントがありません).*/\1/'
          else
            echo '::error::Calendar validation did not pass. Check CMS read access and required event fields.'
            exit 1
          fi

  operations:
    if: inputs.cms_readonly_diagnostics != true && inputs.check_only != true && ((github.event_name == 'repository_dispatch' && vars.ENABLE_CALENDAR_SYNC == 'true') || (github.event_name != 'repository_dispatch' && (vars.ENABLE_CALENDAR_SYNC == 'true' || vars.ENABLE_SOCIAL_PUBLISHING == 'true' || vars.AUTO_ARCHIVE_PAST_EVENTS == 'true')))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Sync Google Calendar
        if: vars.ENABLE_CALENDAR_SYNC == 'true'
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_CLEAR_BEFORE_SYNC: 'false'
          GOOGLE_CALENDAR_SYNC_CMS_ONLY: 'true'
        run: |
          if [ -z "$GOOGLE_CALENDAR_ID" ]; then
            echo '::error::The calendar ID must be configured explicitly.'
            exit 1
          fi
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || { [ -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ] && [ -n "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY" ]; }; then
            npm run sync:calendar
          else
            echo "::error::Calendar sync is enabled but write credentials are missing."
            exit 1
          fi

      - name: Publish approved social notices
        if: ${{ !cancelled() && vars.ENABLE_SOCIAL_PUBLISHING == 'true' && github.event_name != 'repository_dispatch' }}
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v23.0
        run: npm run publish:social

      - name: Archive old published events
        if: ${{ !cancelled() && vars.AUTO_ARCHIVE_PAST_EVENTS == 'true' && github.event_name != 'repository_dispatch' }}
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
          AUTO_ARCHIVE_PAST_EVENTS: ${{ vars.AUTO_ARCHIVE_PAST_EVENTS }}
        run: npm run archive:events

