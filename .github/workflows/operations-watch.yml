name: Operations watch
on:
  schedule:
    - cron: "27 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: operations-watch
  cancel-in-progress: false
jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ">=22.23.5 <23"
      - name: Inspect public pages, login protection and latest update jobs
        env:
          GH_TOKEN: ${{ github.token }}
          CALENDAR_SYNC_EXPECTED: ${{ vars.ENABLE_CALENDAR_SYNC }}
          RECOVER_CALENDAR_SCHEDULE: "true"
        run: node scripts/check-operations-health.mjs
