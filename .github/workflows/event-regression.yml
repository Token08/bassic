name: Event regression

on:
  pull_request:
    paths:
      - "admin-app/**"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/event-regression.yml"
  workflow_dispatch:
    inputs:
      public_image_probe:
        type: boolean
        default: false
        description: Read-only image feasibility probe for three fixed public Bassic events; no credentials or posts

permissions:
  contents: read

concurrency:
  group: event-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-events:
    if: inputs.public_image_probe != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin-app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix admin-app
      - run: npm run test:events
      - run: npm run test:facebook-images
      - run: npm run test:publish-safety
      - run: npm run build
      - run: npm run build:admin-app
      # All provider writes stay in memory. No CMS or calendar secrets are used.
      - name: Rehearse isolated event APIs (browser coverage runs locally)
        run: npm run smoke:events:isolated
      - name: Rehearse full-site editing without provider writes
        run: npm run smoke:visual-editor
  public-image-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.public_image_probe == true
    # Keep the experimental browser version on its supported OS, independently of latest-runner migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install isolated public-page browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/bassic-image-probe" --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          "$RUNNER_TEMP/bassic-image-probe/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Read three public event images without accounts or provider writes
        env:
          BASSIC_QA_PLAYWRIGHT: ${{ runner.temp }}/bassic-image-probe/node_modules/playwright
        run: |
          node scripts/facebook-image-browser-probe.mjs --execute-public-probe "$RUNNER_TEMP/bassic-image-results" https://www.facebook.com/events/1821212975591464/ https://www.facebook.com/events/29205926255674734/ https://www.facebook.com/events/2385993572172152/
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/bassic-image-results/browser-report.json","utf8")); if(r.results.length!==3 || !r.results.every(x=>x.ok)) process.exit(1);'
      - name: Retain sanitized diagnostic report only (no image files)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: public-image-probe-report
          path: ${{ runner.temp }}/bassic-image-results/browser-report.json
          retention-days: 3
          if-no-files-found: ignore
