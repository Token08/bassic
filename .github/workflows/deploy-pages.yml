name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch social feeds
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: bar_Bassic
          SOCIAL_FEED_LIMIT: 5
          META_GRAPH_VERSION: v23.0
        run: npm run fetch:social

      - name: Install browser sync runtime
        if: vars.FACEBOOK_BROWSER_SYNC == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Fetch Facebook events
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_EVENTS_ICAL_URL: ${{ secrets.FACEBOOK_EVENTS_ICAL_URL }}
          GOOGLE_CALENDAR_ICAL_URL: ${{ secrets.GOOGLE_CALENDAR_ICAL_URL }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          FACEBOOK_BROWSER_SYNC: ${{ vars.FACEBOOK_BROWSER_SYNC }}
          FACEBOOK_BROWSER_COOKIES_JSON: ${{ secrets.FACEBOOK_BROWSER_COOKIES_JSON }}
          FACEBOOK_EVENTS_LIMIT: 20
          META_GRAPH_VERSION: v23.0
        run: npm run fetch:events

      - name: Sync Google Calendar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_CLEAR_BEFORE_SYNC: ${{ vars.GOOGLE_CALENDAR_CLEAR_BEFORE_SYNC }}
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] || { [ -n "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ] && [ -n "$GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY" ]; }; then
            npm run sync:calendar
          else
            echo "Skipping Google Calendar sync because write credentials are not configured."
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_URL: https://token08.github.io/bassic
          NEXT_PUBLIC_BASE_PATH: /bassic
          NEXT_PUBLIC_INSTAGRAM_WIDGET_SRC: ${{ vars.NEXT_PUBLIC_INSTAGRAM_WIDGET_SRC }}
          NEXT_PUBLIC_X_WIDGET_SRC: ${{ vars.NEXT_PUBLIC_X_WIDGET_SRC }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
