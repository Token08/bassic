name: Publish website
run-name: ${{ github.event.client_payload.requestId && format('Bassic publish {0}', github.event.client_payload.requestId) || 'Publish website' }}

on:
  push:
    branches:
      - main
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "通常の公開 / ロリポップ用の出力のみ / ロリポップの公開候補へ転送"
        type: choice
        default: current
        options:
          - current
          - package-lolipop
          - stage-lolipop
          - pull-lolipop
  repository_dispatch:
    types:
      - microcms_publish

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BASSIC_LOLIPOP_BUILD: ${{ vars.LOLIPOP_PUBLISH_ENABLED == 'true' || vars.LOLIPOP_PULL_ENABLED == 'true' || contains(fromJSON('["package-lolipop","stage-lolipop","pull-lolipop"]'), inputs.target || '') }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ (vars.LOLIPOP_PUBLISH_ENABLED == 'true' || vars.LOLIPOP_PULL_ENABLED == 'true' || contains(fromJSON('["package-lolipop","stage-lolipop","pull-lolipop"]'), inputs.target || '')) && 'https://www.bassic.jp' || vars.NEXT_PUBLIC_PREVIEW_URL || 'https://token08.github.io/bassic' }}
      NEXT_PUBLIC_BASE_PATH: ${{ (vars.LOLIPOP_PUBLISH_ENABLED != 'true' && vars.LOLIPOP_PULL_ENABLED != 'true' && !contains(fromJSON('["package-lolipop","stage-lolipop","pull-lolipop"]'), inputs.target || '')) && vars.NEXT_PUBLIC_BASE_PATH || '' }}
      NEXT_PUBLIC_NOINDEX: ${{ (vars.LOLIPOP_PUBLISH_ENABLED != 'true' && vars.LOLIPOP_PULL_ENABLED != 'true' && !contains(fromJSON('["package-lolipop","stage-lolipop","pull-lolipop"]'), inputs.target || '')) && vars.NEXT_PUBLIC_NOINDEX || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check operation failure handling
        if: github.event_name != 'schedule'
        run: |
          node --experimental-strip-types --test scripts/ops-failure.test.mjs scripts/public-site-url.test.mjs scripts/calendar-upsert.test.mjs scripts/facebook-event-time.test.mjs scripts/pdf-upload.test.mjs scripts/operations-health.test.mjs
          python3 -B scripts/backup-public-release.test.py

      - name: Check microCMS schema
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run smoke:cms

      - name: Fetch social feeds
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: bar_Bassic
          SOCIAL_FEED_LIMIT: 5
          META_GRAPH_VERSION: v23.0
        run: npm run fetch:social

      - name: Install browser sync runtime
        if: vars.FACEBOOK_BROWSER_SYNC == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Fetch Facebook events
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_EVENTS_ICAL_URL: ${{ secrets.FACEBOOK_EVENTS_ICAL_URL }}
          GOOGLE_CALENDAR_ICAL_URL: ${{ secrets.GOOGLE_CALENDAR_ICAL_URL }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          FACEBOOK_BROWSER_SYNC: ${{ vars.FACEBOOK_BROWSER_SYNC }}
          FACEBOOK_BROWSER_COOKIES_JSON: ${{ secrets.FACEBOOK_BROWSER_COOKIES_JSON }}
          FACEBOOK_EVENTS_LIMIT: 20
          META_GRAPH_VERSION: v23.0
        run: npm run fetch:events

      - name: Build static site
        env:
          NEXT_PUBLIC_DEDICATED_ADMIN_URL: ${{ vars.NEXT_PUBLIC_DEDICATED_ADMIN_URL }}
          NEXT_PUBLIC_ADMIN_ENTRY_PASSWORD_HASH: ${{ vars.NEXT_PUBLIC_ADMIN_ENTRY_PASSWORD_HASH || secrets.ADMIN_ENTRY_PASSWORD_HASH }}
          NEXT_PUBLIC_INSTAGRAM_WIDGET_SRC: ${{ vars.NEXT_PUBLIC_INSTAGRAM_WIDGET_SRC }}
          NEXT_PUBLIC_X_WIDGET_SRC: ${{ vars.NEXT_PUBLIC_X_WIDGET_SRC }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run build

      - name: Smoke check published output
        run: |
          npm run smoke:links
          npm run smoke:content
          npm run smoke:seo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Validate Lolipop package
        if: env.BASSIC_LOLIPOP_BUILD == 'true'
        run: python3 scripts/deploy-lolipop.py out --check

  deploy:
    if: vars.LOLIPOP_PUBLISH_ENABLED != 'true' && vars.LOLIPOP_PULL_ENABLED != 'true' && !contains(fromJSON('["package-lolipop","stage-lolipop","pull-lolipop"]'), inputs.target || '')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-lolipop:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'stage-lolipop' || (vars.LOLIPOP_PUBLISH_ENABLED == 'true' && vars.LOLIPOP_PULL_ENABLED != 'true' && (inputs.target == 'current' || !inputs.target)))
    environment: lolipop
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: package
      - name: Extract verified static output
        run: mkdir out && tar -xf package/artifact.tar -C out
      - name: Deploy to the dedicated folder over FTPS
        env:
          LOLIPOP_FTPS: ${{ secrets.LOLIPOP_FTPS }}
        run: python3 scripts/deploy-lolipop.py out

  publish-lolipop-release:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'pull-lolipop' || (vars.LOLIPOP_PULL_ENABLED == 'true' && (inputs.target == 'current' || !inputs.target)))
    environment: lolipop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: package
      - name: Sign verified static output
        env:
          LOLIPOP_RELEASE_SIGNING_KEY: ${{ secrets.LOLIPOP_RELEASE_SIGNING_KEY }}
        run: |
          mkdir out
          tar -xf package/artifact.tar -C out
          php -l scripts/pull-lolipop-release.php
          python3 scripts/package-lolipop-release.py out bassic-site.release
      - name: Publish signed package for Lolipop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view bassic-production >/dev/null 2>&1; then
            gh release create bassic-production --target "$GITHUB_SHA" --latest=false --title "Bassic production site package" --notes "Signed static files for the Bassic website."
          fi
          python3 scripts/backup-public-release.py
          gh release upload bassic-production bassic-site.release --clobber
      - name: Confirm release served by the production site
        if: vars.LOLIPOP_PULL_ENABLED == 'true'
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://www.bassic.jp/_bassic-build.json?run=$GITHUB_RUN_NUMBER" | jq -e --argjson run "$GITHUB_RUN_NUMBER" --arg commit "$GITHUB_SHA" '.run == $run and .commit == $commit' >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "The signed build has not been confirmed on the production domain." >&2
          exit 1
      - name: Read-only production checks
        if: vars.LOLIPOP_PULL_ENABLED == 'true'
        env:
          PUBLIC_EXPECT_COMMIT: ${{ github.sha }}
        run: |
          node scripts/check-public-readonly.mjs
          node scripts/smoke-admin-app-production.mjs
