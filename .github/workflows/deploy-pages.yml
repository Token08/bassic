name: Publish website

on:
  push:
    branches:
      - main
  schedule:
    - cron: "12 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "通常の公開 / ロリポップ用の出力のみ / ロリポップの公開候補へ転送"
        type: choice
        default: current
        options:
          - current
          - package-lolipop
          - stage-lolipop
  repository_dispatch:
    types:
      - microcms_publish

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NEXT_PUBLIC_SITE_URL: ${{ (vars.LOLIPOP_PUBLISH_ENABLED == 'true' || inputs.target == 'package-lolipop' || inputs.target == 'stage-lolipop') && 'https://www.bassic.jp' || vars.NEXT_PUBLIC_SITE_URL || 'https://www.bassic.jp' }}
  NEXT_PUBLIC_BASE_PATH: ${{ (vars.LOLIPOP_PUBLISH_ENABLED != 'true' && inputs.target != 'package-lolipop' && inputs.target != 'stage-lolipop') && vars.NEXT_PUBLIC_BASE_PATH || '' }}
  NEXT_PUBLIC_NOINDEX: ${{ (vars.LOLIPOP_PUBLISH_ENABLED != 'true' && inputs.target != 'package-lolipop' && inputs.target != 'stage-lolipop') && vars.NEXT_PUBLIC_NOINDEX || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check operation failure handling
        if: github.event_name != 'schedule'
        run: node --experimental-strip-types --test scripts/ops-failure.test.mjs scripts/public-site-url.test.mjs scripts/calendar-upsert.test.mjs

      - name: Check microCMS schema
        env:
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run smoke:cms

      - name: Fetch social feeds
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: bar_Bassic
          SOCIAL_FEED_LIMIT: 5
          META_GRAPH_VERSION: v23.0
        run: npm run fetch:social

      - name: Install browser sync runtime
        if: vars.FACEBOOK_BROWSER_SYNC == 'true'
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Fetch Facebook events
        continue-on-error: true
        env:
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_EVENTS_ICAL_URL: ${{ secrets.FACEBOOK_EVENTS_ICAL_URL }}
          GOOGLE_CALENDAR_ICAL_URL: ${{ secrets.GOOGLE_CALENDAR_ICAL_URL }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          FACEBOOK_BROWSER_SYNC: ${{ vars.FACEBOOK_BROWSER_SYNC }}
          FACEBOOK_BROWSER_COOKIES_JSON: ${{ secrets.FACEBOOK_BROWSER_COOKIES_JSON }}
          FACEBOOK_EVENTS_LIMIT: 20
          META_GRAPH_VERSION: v23.0
        run: npm run fetch:events

      - name: Build static site
        env:
          NEXT_PUBLIC_DEDICATED_ADMIN_URL: ${{ vars.NEXT_PUBLIC_DEDICATED_ADMIN_URL }}
          NEXT_PUBLIC_ADMIN_ENTRY_PASSWORD_HASH: ${{ vars.NEXT_PUBLIC_ADMIN_ENTRY_PASSWORD_HASH || secrets.ADMIN_ENTRY_PASSWORD_HASH }}
          NEXT_PUBLIC_INSTAGRAM_WIDGET_SRC: ${{ vars.NEXT_PUBLIC_INSTAGRAM_WIDGET_SRC }}
          NEXT_PUBLIC_X_WIDGET_SRC: ${{ vars.NEXT_PUBLIC_X_WIDGET_SRC }}
          MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: npm run build

      - name: Smoke check published output
        run: |
          npm run smoke:links
          npm run smoke:content
          npm run smoke:seo

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - name: Validate Lolipop package
        if: vars.LOLIPOP_PUBLISH_ENABLED == 'true' || inputs.target == 'package-lolipop' || inputs.target == 'stage-lolipop'
        run: python3 scripts/deploy-lolipop.py out --check

  deploy:
    if: vars.LOLIPOP_PUBLISH_ENABLED != 'true' && inputs.target != 'package-lolipop' && inputs.target != 'stage-lolipop'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-lolipop:
    if: github.ref == 'refs/heads/main' && (inputs.target == 'stage-lolipop' || (vars.LOLIPOP_PUBLISH_ENABLED == 'true' && inputs.target != 'package-lolipop'))
    environment: lolipop
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: package
      - name: Extract verified static output
        run: mkdir out && tar -xf package/artifact.tar -C out
      - name: Deploy to the dedicated folder over FTPS
        env:
          LOLIPOP_FTPS: ${{ secrets.LOLIPOP_FTPS }}
        run: python3 scripts/deploy-lolipop.py out
